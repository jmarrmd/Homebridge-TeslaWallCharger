name: Publish to npm

# Publishes the package to npm whenever a GitHub Release is published.
# Requires a repository secret named NPM_TOKEN (an npm "Automation" access
# token with publish rights for homebridge-tesla-wall-connector).
#
# Usage:
#   1. Add the NPM_TOKEN secret (Settings -> Secrets and variables -> Actions).
#   2. Make sure package.json `version` is bumped and committed.
#   3. Create a GitHub Release with a tag matching the version, e.g. v1.2.0.
# The job below double-checks the tag and package.json version agree before
# publishing, so a mismatched/forgotten bump fails loudly instead of shipping.

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Verify package.json version matches the release tag
        if: github.event_name == 'release'
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json version: $PKG_VERSION | release tag: $TAG"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::Release tag ($TAG) does not match package.json version ($PKG_VERSION). Bump package.json or fix the tag."
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
